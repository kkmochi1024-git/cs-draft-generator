[project]
name = "cs-draft-generator"
version = "0.1.0"
description = "カスタマーサポート回答ドラフト生成システム"
requires-python = ">=3.11"
dependencies = [
    "langchain>=0.3",
    "langchain-community>=0.3",
    "langchain-chroma>=0.2",
    "langchain-ollama>=0.3",
    "chromadb>=0.5",
    "spacy>=3.7",
    "ginza>=5.2",
    "ja-ginza>=5.2",
    "beautifulsoup4>=4.12",
    "pymupdf>=1.24",
    "streamlit>=1.38",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.8",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"
